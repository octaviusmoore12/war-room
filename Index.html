:root{--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--border:#475569;--text:#f1f5f9;--textDim:#94a3b8;--accent:#3b82f6;--accent2:#8b5cf6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--orange:#f97316}
.light{--bg:#f8fafc;--surface:#ffffff;--surface2:#f1f5f9;--border:#e2e8f0;--text:#0f172a;--textDim:#64748b;--accent:#2563eb;--accent2:#7c3aed;--green:#16a34a;--yellow:#ca8a04;--red:#dc2626;--orange:#ea580c}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:13px;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:var(--border)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.85}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn-xs{padding:2px 8px;font-size:11px;border-radius:4px}
input,select,textarea{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:600}
.badge-green{background:rgba(34,197,94,.15);color:var(--green)}
.badge-yellow{background:rgba(234,179,8,.15);color:var(--yellow)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red)}
.badge-blue{background:rgba(59,130,246,.15);color:var(--accent)}
.badge-purple{background:rgba(139,92,246,.15);color:var(--accent2)}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--textDim);transition:all .2s;border:none;background:transparent}
.tab.active{background:var(--accent);color:#fff}
.tab:hover:not(.active){background:var(--surface2)}
.score-bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.score-fill{height:100%;border-radius:3px;transition:width .5s}
.tier-zone{min-height:60px;border:2px dashed var(--border);border-radius:8px;padding:8px;transition:all .2s}
.tier-zone.drag-over{border-color:var(--accent);background:rgba(59,130,246,.08)}
.player-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:500;cursor:grab;transition:all .15s;border:1px solid var(--border);background:var(--surface)}
.player-chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.player-chip.dragging{opacity:.5;transform:scale(.95)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:600px;width:90%;max-height:85vh;overflow-y:auto}
.sidebar{width:280px;min-width:280px;background:var(--surface);border-right:1px solid var(--border);height:100vh;overflow-y:auto;transition:all .3s}
.tooltip{position:relative}.tooltip:hover::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#0f172a;color:#f1f5f9;padding:4px 8px;border-radius:4px;font-size:11px;white-space:nowrap;z-index:99}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulse{animation:pulse 2s infinite}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.color-dot{width:22px;height:22px;border-radius:6px;cursor:pointer;border:3px solid transparent;flex-shrink:0;transition:all .1s}
.color-dot.sel{border-color:var(--text)}
.check-btn{width:22px;height:22px;border-radius:4px;border:2px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.check-btn.checked{background:var(--green);border-color:var(--green);color:#fff}
.drafted-overlay{position:relative;opacity:.55}
</style>
</head>

// ═══════════════════════════════════════════════════════════
// SCORING ENGINES
// ═══════════════════════════════════════════════════════════
const SCORING_FORMATS={standard:{label:'Standard',ppr:0},halfPpr:{label:'Half PPR',ppr:0.5},fullPpr:{label:'Full PPR',ppr:1},superflex:{label:'Superflex',ppr:1,sflex:true},dynasty:{label:'Dynasty',ppr:1,dynasty:true},keeper:{label:'Keeper',ppr:0.5,keeper:true},bestBall:{label:'Best Ball',ppr:1,bestBall:true},custom:{label:'Custom',ppr:0.5}};

const OFF_SCHEMES=['West Coast','Spread','Air Raid','Vertical','Run Heavy','Power Run','Zone Run','Balanced'];
const DEF_SCHEMES=['4-3 Base','3-4 Base','Nickel Heavy','Dime Heavy','Cover 2','Cover 3','Cover 4','Man Coverage','Zone Coverage','Hybrid'];

function calcFantasyScore(p,format='halfPpr'){
const f=SCORING_FORMATS[format]||SCORING_FORMATS.halfPpr;
const isDynasty=f.dynasty||false;
const isSflex=f.sflex||false;
let score=0;
const ageFactor=p.pos==='QB'?Math.max(0,(38-p.age)/18):p.pos==='RB'?Math.max(0,(32-p.age)/14):p.pos==='WR'?Math.max(0,(35-p.age)/17):Math.max(0,(36-p.age)/18);
score+=p.fantPts*2.2;
score+=p.consistency*0.15;
score+=(1-p.injury)*8;
const posScarcity=p.pos==='TE'?8:p.pos==='QB'?(isSflex?12:4):p.pos==='RB'?6:5;
score+=posScarcity;
score+=p.targetShare*0.15;
score+=p.rzUsage*0.2;
score+=p.oppShare*0.08;
score+=p.breakout*0.12;
if(isDynasty)score+=ageFactor*12+p.dynasty*0.08;
if(p.rookie)score+=p.breakout*0.15;
score=Math.min(99,Math.max(1,score));
return Math.round(score);
}

function calcFranchiseScore(p,offScheme='Balanced',defScheme='4-3 Base'){
let score=0;
score+=p.ovr*0.35;
const ageFactor=Math.max(0,(34-p.age)/16);
score+=ageFactor*15;
const devScore=p.dev==='Superstar X-Factor'?15:p.dev==='Superstar'?12:p.dev==='Star'?8:4;
score+=devScore;
const athScore=(p.speed+p.accel+p.agility+p.strength)/4;
score+=athScore*0.12;
score+=(1-p.injury)*6;
score+=(100-p.contract)*0.06;
score+=p.leadership*0.06;
const schemeFit=calcSchemeFit(p,offScheme,defScheme);
score+=schemeFit*0.08;
score=Math.min(99,Math.max(1,score));
return Math.round(score);
}

function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h);}

function calcSchemeFit(p,offScheme,defScheme){
if(p.pos==='DEF'){const h=hashStr(p.name+offScheme+defScheme);return 75+(h%21);}
let fit=70;
if(p.pos==='QB'){
if(offScheme==='Air Raid'||offScheme==='Spread')fit+=p.throwAcc>88?15:5;
if(offScheme==='Run Heavy'||offScheme==='Zone Run')fit+=p.speed>85?12:0;
if(offScheme==='West Coast')fit+=p.throwAcc>90?15:5;
if(offScheme==='Vertical')fit+=p.throwPow>92?15:5;
}else if(p.pos==='RB'){
if(offScheme==='Run Heavy'||offScheme==='Power Run')fit+=p.strength>82?15:5;
if(offScheme==='Zone Run')fit+=p.agility>90?15:5;
if(offScheme==='Spread'||offScheme==='West Coast')fit+=p.agility>88?10:0;
}else if(p.pos==='WR'){
if(offScheme==='Air Raid'||offScheme==='Vertical')fit+=p.speed>92?15:5;
if(offScheme==='West Coast'||offScheme==='Spread')fit+=p.agility>90?12:5;
}else if(p.pos==='TE'){
if(offScheme==='West Coast')fit+=12;
if(offScheme==='Run Heavy'||offScheme==='Power Run')fit+=p.strength>80?10:3;
}
return Math.min(99,Math.max(40,fit));
}

function getSleeperRating(p){return Math.min(99,Math.max(1,Math.round(p.breakout*0.6+(100-calcFantasyScore(p))*0.2+(p.rookie?15:0)+(p.prospect?20:0))))}
function getBustRisk(p){return Math.min(99,Math.max(1,Math.round(p.injury*60+(100-p.consistency)*0.3+(p.age>30?15:0)+(p.rookie?10:0))))}
function getBreakoutScore(p){return Math.min(99,Math.max(1,Math.round(p.breakout*0.7+(p.age<25?15:0)+(p.rookie?10:0)+(p.prospect?15:0))))}

function scoreColor(v){return v>=75?'var(--green)':v>=50?'var(--yellow)':'var(--red)'}
function scoreBadge(v){return v>=75?'badge-green':v>=50?'badge-yellow':'badge-red'}

{id:'t5',name:'Tier 5 — Below',color:'#ef4444',players:[]},
];

const TIER_COLORS=['#22c55e','#3b82f6','#eab308','#f97316','#ef4444','#8b5cf6','#06b6d4','#ec4899','#64748b','#14b8a6'];

function TierBoard({tiers:tiersProp,setTiers,players,mode,format,offScheme,defScheme,gms,onVote}){
const tiers=Array.isArray(tiersProp)?tiersProp:[];
const [colorPicker,setColorPicker]=useState(null);
const [dragOver,setDragOver]=useState(null);
const [editTier,setEditTier]=useState(null);
const [newTierName,setNewTierName]=useState('');

const handleDrop=(tierId,e)=>{
e.preventDefault();
const pid=e.dataTransfer.getData('text/plain');
if(!pid)return;
setTiers(prev=>{
const base=Array.isArray(prev)?prev:[];
const next=base.map(t=>({...t,players:(t.players||[]).filter(id=>id!==pid)}));
const idx=next.findIndex(t=>t.id===tierId);
if(idx>=0&&!next[idx].players.includes(pid))next[idx].players.push(pid);
return next;
});
setDragOver(null);
};

const addTier=()=>{
setTiers(prev=>[...(Array.isArray(prev)?prev:[]),{id:'t'+Date.now(),name:newTierName||'New Tier',color:'#64748b',players:[]}]);
setNewTierName('');
};

const removeTier=(id)=>setTiers(prev=>(Array.isArray(prev)?prev:[]).filter(t=>t.id!==id));
const renameTier=(id,name)=>setTiers(prev=>(Array.isArray(prev)?prev:[]).map(t=>t.id===id?{...t,name}:t));
const recolorTier=(id,color)=>setTiers(prev=>(Array.isArray(prev)?prev:[]).map(t=>t.id===id?{...t,color}:t));

const untiered=players.filter(p=>!tiers.some(t=>(t.players||[]).includes(p.id)));

return <div>
<div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
<input style={{width:200}} value={newTierName} onChange={e=>setNewTierName(e.target.value)} placeholder="New tier name..."/>
<button className="btn btn-primary btn-sm" onClick={addTier}>+ Add Tier</button>
</div>

{tiers.map(tier=><div key={tier.id} style={{marginBottom:12}}>
<div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
<div style={{position:'relative'}}>
<div className="color-dot" style={{background:tier.color}} onClick={()=>setColorPicker(colorPicker===tier.id?null:tier.id)}/>
{colorPicker===tier.id&&<div style={{position:'absolute',top:28,left:0,zIndex:50,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:6,display:'flex',gap:4,flexWrap:'wrap',width:140}}>
{TIER_COLORS.map(c=><div key={c} className={'color-dot'+(tier.color===c?' sel':'')} style={{background:c}} onClick={()=>{recolorTier(tier.id,c);setColorPicker(null);}}/>)}
</div>}
</div>
{editTier===tier.id?<input style={{width:200}} value={tier.name} onChange={e=>renameTier(tier.id,e.target.value)} onBlur={()=>setEditTier(null)} autoFocus/>
:<span style={{fontWeight:700,fontSize:14,cursor:'pointer'}} onClick={()=>setEditTier(tier.id)}>{tier.name}</span>}
<span style={{fontSize:11,color:'var(--textDim)'}}>({(tier.players||[]).length})</span>
<button className="btn btn-secondary btn-xs" onClick={()=>removeTier(tier.id)}>✕</button>
</div>
<div className={`tier-zone ${dragOver===tier.id?'drag-over':''}`}
onDragOver={e=>{e.preventDefault();setDragOver(tier.id);}}
onDragLeave={()=>setDragOver(null)}
onDrop={e=>handleDrop(tier.id,e)}
style={{borderColor:tier.color+'60'}}>
<div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
{tier.players.map(pid=>{
const pl=players.find(p=>p.id===pid);
if(!pl)return null;
const sc=mode==='fantasy'?calcFantasyScore(pl,format):calcFranchiseScore(pl,offScheme,defScheme);
return <div key={pid} className="player-chip" draggable
onDragStart={e=>{e.dataTransfer.setData('text/plain',pid);e.dataTransfer.effectAllowed='move';}}
style={{borderLeftColor:tier.color,borderLeftWidth:3}}>
<span style={{fontWeight:600}}>{pl.name}</span>
<span className="badge badge-blue" style={{fontSize:10}}>{pl.pos}</span>
<span style={{fontSize:11,fontWeight:700,color:scoreColor(sc)}}>{sc}</span>
</div>;
})}
{tier.players.length===0&&<span style={{fontSize:12,color:'var(--textDim)',padding:8}}>Drop players here</span>}
</div>
</div>
</div>)}

<div style={{marginTop:16}}>
<h4 style={{fontSize:14,fontWeight:700,marginBottom:8,color:'var(--textDim)'}}>Untiered Players ({untiered.length})</h4>
<div style={{display:'flex',gap:6,flexWrap:'wrap',maxHeight:200,overflowY:'auto'}}>
{untiered.slice(0,60).map(pl=>{
const sc=mode==='fantasy'?calcFantasyScore(pl,format):calcFranchiseScore(pl,offScheme,defScheme);
return <div key={pl.id} className="player-chip" draggable
onDragStart={e=>{e.dataTransfer.setData('text/plain',pl.id);e.dataTransfer.effectAllowed='move';}}>
<span style={{fontWeight:600}}>{pl.name}</span>
<span className="badge badge-blue" style={{fontSize:10}}>{pl.pos}</span>
<span style={{fontSize:11,fontWeight:700,color:scoreColor(sc)}}>{sc}</span>
</div>;
})}
</div>
</div>
</div>;
}

function CollabDashboard({players,gms,format,mode,offScheme,defScheme}){
const withVotes=players.map(p=>{
const v1=(gms[0]?.votes||{})[p.id]||0;
const v2=(gms[1]?.votes||{})[p.id]||0;
return {...p,v1,v2,total:v1+v2,diff:Math.abs(v1-v2)};
});
const mostLoved=withVotes.filter(p=>p.total>0).sort((a,b)=>b.total-a.total).slice(0,8);
const polarizing=withVotes.filter(p=>p.total>0&&p.diff>0).sort((a,b)=>b.diff-a.diff).slice(0,8);
const gm1Favs=withVotes.filter(p=>p.v1>0).sort((a,b)=>b.v1-a.v1).slice(0,8);
const gm2Favs=withVotes.filter(p=>p.v2>0).sort((a,b)=>b.v2-a.v2).slice(0,8);
const noVotes=withVotes.filter(p=>p.total===0);
const totalV1=Object.values(gms[0]?.votes||{}).reduce((s,v)=>s+Math.abs(v),0);
const totalV2=Object.values(gms[1]?.votes||{}).reduce((s,v)=>s+Math.abs(v),0);
const agreement=mostLoved.length?Math.round((mostLoved.filter(p=>p.v1>0&&p.v2>0).length/mostLoved.length)*100):0;

return <div className="grid-auto">
<div className="card">
<h4 style={{fontWeight:700,marginBottom:12,fontSize:14}}>❤️ Most Loved (Combined Votes)</h4>
{mostLoved.map(p=><div key={p.id} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
<span style={{fontWeight:600,fontSize:13}}>{p.name}</span>
<div style={{display:'flex',gap:6}}>
{gms[0]?.name&&<span style={{fontSize:11,color:gms[0].color}}>{p.v1}</span>}
{gms[1]?.name&&<span style={{fontSize:11,color:gms[1].color}}>{p.v2}</span>}
<span style={{fontWeight:700,fontSize:12}}>= {p.total}</span>
</div></div>)}
</div>
<div className="card">
<h4 style={{fontWeight:700,marginBottom:12,fontSize:14}}>⚡ Most Polarizing</h4>
{polarizing.map(p=><div key={p.id} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
<span style={{fontWeight:600,fontSize:13}}>{p.name}</span>
<span className="badge badge-red">Δ {p.diff}</span>
</div>)}
{polarizing.length===0&&<span style={{fontSize:12,color:'var(--textDim)'}}>No polarizing picks yet</span>}
</div>
<div className="card">
<h4 style={{fontWeight:700,marginBottom:12,fontSize:14}}>📊 Agreement Score</h4>
<div style={{textAlign:'center',padding:16}}>
<div style={{fontSize:48,fontWeight:800,color:scoreColor(agreement)}}>{agreement}%</div>
<div style={{color:'var(--textDim)',fontSize:13}}>GM Consensus</div>
<div style={{marginTop:12,display:'flex',justifyContent:'center',gap:24}}>
{gms[0]?.name&&<div><div style={{fontSize:20,fontWeight:700,color:gms[0].color}}>{totalV1}/{VOTE_BUDGET}</div><div style={{fontSize:11,color:'var(--textDim)'}}>{gms[0].name}</div></div>}
{gms[1]?.name&&<div><div style={{fontSize:20,fontWeight:700,color:gms[1].color}}>{totalV2}/{VOTE_BUDGET}</div><div style={{fontSize:11,color:'var(--textDim)'}}>{gms[1].name}</div></div>}
</div>
</div>
</div>
<div className="card">
<h4 style={{fontWeight:700,marginBottom:12,fontSize:14}}>🔇 No Votes ({noVotes.length})</h4>
<div style={{maxHeight:200,overflowY:'auto'}}>
{noVotes.slice(0,15).map(p=><div key={p.id} style={{padding:'4px 0',fontSize:12,color:'var(--textDim)'}}>
{p.name} · {p.pos}
</div>)}
</div>
</div>
</div>;
}

function Recommendations({players,mode,format,offScheme,defScheme}){
if(mode==='fantasy'){
// ONLY current NFL players — never college prospects
const nfl=players.filter(p=>p.type!=='prospect');
const scored=nfl.map(p=>({...p,fs:calcFantasyScore(p,format),sl:getSleeperRating(p),bust:getBustRisk(p),bk:getBreakoutScore(p)}));
const sleepers=[...scored].sort((a,b)=>b.sl-a.sl).slice(0,6);
const leagueWinners=scored.filter(p=>p.bk>50&&p.fs>60).slice(0,6);
const breakouts=[...scored].sort((a,b)=>b.bk-a.bk).slice(0,6);
const busts=[...scored].sort((a,b)=>b.bust-a.bust).slice(0,6);
const values=scored.filter(p=>p.fs>65).sort((a,b)=>a.fs-b.fs).slice(0,6);

return <div className="grid-auto">
{[['😴 Sleepers',sleepers,'sl','Sleeper'],['🏆 League Winners',leagueWinners,'bk','Breakout'],['🚀 Breakout',breakouts,'bk','Breakout'],['⚠️ Bust Risks',busts,'bust','Bust'],['💎 Value Picks',values,'fs','Score']].map(([title,list,key,label])=>
<div className="card" key={title}>
<h4 style={{fontWeight:700,marginBottom:12,fontSize:14}}>{title}</h4>
{list.map(p=><div key={p.id} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid var(--border)'}}>
<span style={{fontSize:13}}><b>{p.name}</b> <span style={{color:'var(--textDim)'}}>{p.pos}</span></span>
<span className={'badge '+scoreBadge(key==='bust'?100-p[key]:p[key])}>{label} {p[key]}</span>
</div>)}
</div>)}
</div>;
}else{
const scored=players.map(p=>({...p,fr:calcFranchiseScore(p,offScheme,defScheme),sf:calcSchemeFit(p,offScheme,defScheme)}));
const futureStars=scored.filter(p=>p.age<25).sort((a,b)=>b.fr-a.fr).slice(0,6);
const schemeFits=scored.sort((a,b)=>b.sf-a.sf).slice(0,6);
const bestContracts=scored.filter(p=>p.contract>0).sort((a,b)=>(b.fr/Math.max(1,b.contract))-(a.fr/Math.max(1,a.contract))).slice(0,6);
const cornerstones=scored.sort((a,b)=>b.fr-a.fr).slice(0,6);
const devTargets=scored.filter(p=>p.dev==='Superstar'||p.dev==='Superstar X-Factor').filter(p=>p.age<26).sort((a,b)=>b.fr-a.fr).slice(0,6);

return <div className="grid-auto">
{[['⭐ Future Stars',futureStars,'fr','Score'],['🎯 Scheme Fits',schemeFits,'sf','Fit'],['💰 Best Value',bestContracts,'fr','Score'],['🏛️ Cornerstones',cornerstones,'fr','Score'],['📈 Dev Targets',devTargets,'fr','Score']].map(([title,list,key,label])=>
<div className="card" key={title}>
<h4 style={{fontWeight:700,marginBottom:12,fontSize:14}}>{title}</h4>
{list.map(p=><div key={p.id} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid var(--border)'}}>
<span style={{fontSize:13}}><b>{p.name}</b> <span style={{color:'var(--textDim)'}}>{p.pos}</span></span>
<span className={'badge '+scoreBadge(p[key])}>{label} {p[key]}</span>
</div>)}
</div>)}
</div>;
}
}

// BOARD MANAGER
// ═══════════════════════════════════════════════════════════
function BoardManager({boards,setBoards,activeBoard,setActiveBoard,onSaveAll,onLoadAll}){
const [newName,setNewName]=useState('');
const [editingId,setEditingId]=useState(null);
const [pwModal,setPwModal]=useState(null);
const [pwInput,setPwInput]=useState('');
const [pwErr,setPwErr]=useState('');
const [newPw,setNewPw]=useState('');

const tryOpenBoard=(b)=>{
if(b.password){setPwModal({boardId:b.id,action:'open'});setPwInput('');setPwErr('');}
else setActiveBoard(b.id);
};
const confirmPw=()=>{
const b=boards.find(bb=>bb.id===pwModal.boardId);
if(b&&pwInput===b.password){setActiveBoard(b.id);setPwModal(null);setPwInput('');setPwErr('');}
else{setPwInput('');setPwErr('Incorrect password');}
};
const setPassword=(boardId)=>{
setBoards(prev=>prev.map(b=>b.id===boardId?{...b,password:newPw}:b));
setNewPw('');setPwModal(null);
};

const createBoard=()=>{
const b={id:'b'+Date.now(),name:newName||'New Board',created:Date.now(),archived:false,password:'',
tiers:DEFAULT_TIERS.map(t=>({...t,players:[]})),
format:'halfPpr',offScheme:'Balanced',defScheme:'4-3 Base',
gms:[{name:'',color:'#3b82f6',pin:'',votes:{}},{name:'',color:'#ef4444',pin:'',votes:{}}],
notes:{},tags:{},filters:{},draftedIds:[],bbRounds:{},bbTags:{},bbBoard:bbEmptyBoard()};
setBoards(prev=>[...prev,b]);
setActiveBoard(b.id);
setNewName('');
};
const duplicateBoard=(b)=>{
const dup={...JSON.parse(JSON.stringify(b)),id:'b'+Date.now(),name:b.name+' (Copy)',created:Date.now()};
setBoards(prev=>[...prev,dup]);
};
const archiveBoard=(id)=>setBoards(prev=>prev.map(b=>b.id===id?{...b,archived:!b.archived}:b));
const deleteBoard=(id)=>{setBoards(prev=>prev.filter(b=>b.id!==id));if(activeBoard===id)setActiveBoard(null);};
const exportBoard=(b)=>{
const blob=new Blob([JSON.stringify(b,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=b.name+'.json';a.click();
};
const importBoard=(e)=>{
const file=e.target.files[0];if(!file)return;
const r=new FileReader();r.onload=ev=>{try{const b=migrateBB(JSON.parse(ev.target.result));b.id='b'+Date.now();setBoards(prev=>[...prev,b]);}catch(err){alert('Invalid board file');}};r.readAsText(file);
};

const active=boards.filter(b=>!b.archived);
const archived=boards.filter(b=>b.archived);

return <div>
<div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
<input style={{width:200}} value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Board name..."/>
<button className="btn btn-primary btn-sm" onClick={createBoard}>+ New Board</button>
<label className="btn btn-secondary btn-sm" style={{cursor:'pointer'}}>
📥 Import<input type="file" accept=".json" onChange={importBoard} style={{display:'none'}}/>
</label>
<button className="btn btn-success btn-sm" onClick={onSaveAll}>💾 Save All</button>
<label className="btn btn-secondary btn-sm" style={{cursor:'pointer'}}>📂 Load Save<input type="file" accept=".json" onChange={onLoadAll} style={{display:'none'}}/></label>
</div>
<div style={{display:'flex',flexDirection:'column',gap:6}}>
{active.map(b=><div key={b.id} className="card-sm" style={{display:'flex',justifyContent:'space-between',alignItems:'center',
background:activeBoard===b.id?'var(--accent)':'var(--surface)',color:activeBoard===b.id?'#fff':'var(--text)',cursor:'pointer'}}
onClick={()=>tryOpenBoard(b)}>
<div style={{display:'flex',alignItems:'center',gap:8}}>
{b.password&&<span style={{fontSize:14}}>🔒</span>}
{editingId===b.id?<input value={b.name} onClick={e=>e.stopPropagation()} onChange={e=>setBoards(prev=>prev.map(bb=>bb.id===b.id?{...bb,name:e.target.value}:bb))} onBlur={()=>setEditingId(null)} autoFocus style={{width:150}}/>
:<span style={{fontWeight:600,fontSize:13}}>{b.name}</span>}
</div>
<div style={{display:'flex',gap:4}} onClick={e=>e.stopPropagation()}>
<button className="btn btn-xs btn-secondary" onClick={()=>setEditingId(b.id)}>✏️</button>
<button className="btn btn-xs btn-secondary" title="Password protect" onClick={()=>{setPwModal({boardId:b.id,action:'setPw'});setNewPw(b.password||'');}}>🔐</button>
<button className="btn btn-xs btn-secondary" onClick={()=>duplicateBoard(b)}>📋</button>
<button className="btn btn-xs btn-secondary" onClick={()=>exportBoard(b)}>📤</button>
<button className="btn btn-xs btn-secondary" onClick={()=>archiveBoard(b.id)}>📦</button>
<button className="btn btn-xs btn-danger" onClick={()=>deleteBoard(b.id)}>🗑</button>
</div>
</div>)}
</div>
{archived.length>0&&<div style={{marginTop:16}}>
<h5 style={{fontSize:12,fontWeight:600,color:'var(--textDim)',marginBottom:8}}>ARCHIVED</h5>
{archived.map(b=><div key={b.id} className="card-sm" style={{display:'flex',justifyContent:'space-between',alignItems:'center',opacity:.6,marginBottom:4}}>

<button className="btn btn-xs btn-secondary" onClick={()=>archiveBoard(b.id)}>Restore</button>
<button className="btn btn-xs btn-danger" onClick={()=>deleteBoard(b.id)}>🗑</button>
</div>
</div>)}
</div>}

<Modal open={!!pwModal} onClose={()=>{setPwModal(null);setPwErr('');}} title={pwModal?.action==='open'?'Enter Board Password':'Set Board Password'}>
{pwModal?.action==='open'?<div style={{display:'flex',flexDirection:'column',gap:12,alignItems:'center'}}>
<p style={{fontSize:13,color:'var(--textDim)'}}>This board is password protected.</p>

<button className="btn btn-primary" onClick={confirmPw}>Unlock</button>
</div>:<div style={{display:'flex',flexDirection:'column',gap:12,alignItems:'center'}}>
<p style={{fontSize:13,color:'var(--textDim)'}}>Set a password to protect this board. Leave blank to remove protection.</p>

<button className="btn btn-primary" onClick={()=>setPassword(pwModal.boardId)}>{newPw?'Set Password':'Remove Password'}</button>
</div>}
</Modal>
</div>;
}

const BB_TAGS=[
{k:'gem',label:'💎 Gem',adj:-18},
{k:'sleeper',label:'😴 Sleeper',adj:-12},
{k:'injury',label:'🚑 Injury',adj:20},
{k:'age',label:'⏳ Age',adj:10}
];
const BB_POS_COLORS={QB:'#ef4444',RB:'#3b82f6',WR:'#22c55e',TE:'#f97316',K:'#8b5cf6',DST:'#64748b'};
const BB_POSITIONS=['QB','RB','WR','TE','K','DST'];

// Value engine: expected PPR + positional dropoff + breakout + positional value + tags
function bbEval(p,tagList){
const tags=tagList||[];
let tagAdj=0;tags.forEach(k=>{const t=BB_TAGS.find(x=>x.k===k);if(t)tagAdj+=t.adj;});
const breakout=(p.rank>50&&p.rank<160&&(p.pos==='RB'||p.pos==='WR'||p.pos==='TE')&&p.dropoff>=1)?-8:0;
const adjRank=Math.max(1,p.rank-(p.dropoff*4)+tagAdj+breakout);
const posBonus=p.pos==='RB'?4:p.pos==='WR'?3:p.pos==='TE'?(p.posRank<=3?6:0):p.pos==='QB'?(p.posRank<=2?2:-6):-25;
const value=Math.max(0,Math.min(100,Math.round(100-adjRank*0.45+posBonus)));
const recRound=Math.max(1,Math.min(12,Math.ceil(adjRank/17)));
const adpRound=Math.max(1,Math.min(12,Math.ceil(p.adp/12)));
let verdict,vClass;
if(recRound<adpRound){verdict='VALUE · worth Rd '+recRound+', market Rd '+adpRound;vClass='badge-green';}
else if(recRound>adpRound){verdict='CAUTION · board Rd '+recRound+', market Rd '+adpRound;vClass='badge-red';}
else{verdict='FAIR · Rd '+recRound+' matches market';vClass='badge-blue';}
return {value,recRound,adpRound,verdict,vClass,breakout:breakout<0};
}

// BIG BOARD SLOT MODEL — 12 rounds × 12 numbered slots
// bbBoard: { 1:[pid,pid,...], 2:[...] }  index+1 = slot number
// Legacy saves used bbRounds:{pid:roundNumber} — migrated below.
// ═══════════════════════════════════════════════════════════
const BB_SLOTS=12, BB_ROUNDS=12;
const VOTE_BUDGET=50;
const BB_BY_ID={};BB_PLAYERS.forEach(p=>{BB_BY_ID[p.id]=p;});
const bbEmptyBoard=()=>{const o={};for(let r=1;r<=BB_ROUNDS;r++)o[r]=[];return o;};

// Push overflow past slot 12 down into the next round, cascading.
function bbCascade(bd){
const out={};for(let r=1;r<=BB_ROUNDS;r++)out[r]=[...(bd[r]||[])];
for(let r=1;r<=BB_ROUNDS;r++){
while(out[r].length>BB_SLOTS){
const bumped=out[r].pop();
if(r<BB_ROUNDS)out[r+1].push(bumped);else break;
}
}
return out;
}

// Accepts a board in EITHER format and returns one with a valid bbBoard.
function migrateBB(b){
if(!b||typeof b!=='object')return b;
const valid=b.bbBoard&&typeof b.bbBoard==='object'&&!Array.isArray(b.bbBoard);
if(valid){
const fixed=bbEmptyBoard();
for(let r=1;r<=BB_ROUNDS;r++)fixed[r]=(Array.isArray(b.bbBoard[r])?b.bbBoard[r]:[]).filter(pid=>BB_BY_ID[pid]);
return {...b,bbBoard:bbCascade(fixed)};
}
// ── legacy bbRounds → slots, ordered best-value first inside each round ──
const nb=bbEmptyBoard();
const legacy=b.bbRounds&&typeof b.bbRounds==='object'?b.bbRounds:{};
const tags=b.bbTags&&typeof b.bbTags==='object'?b.bbTags:{};
const byRound={};
Object.keys(legacy).forEach(pid=>{
if(!BB_BY_ID[pid])return;
const r=Math.max(1,Math.min(BB_ROUNDS,parseInt(legacy[pid],10)||1));
(byRound[r]=byRound[r]||[]).push(pid);
});
Object.keys(byRound).forEach(r=>{
nb[r]=byRound[r]
.map(pid=>({pid,g:bbEval(BB_BY_ID[pid],tags[pid]).value}))
.sort((x,y)=>y.g-x.g)
.map(x=>x.pid);
});
return {...b,bbBoard:bbCascade(nb),bbRounds:legacy};
}
const migrateBoards=(arr)=>Array.isArray(arr)?arr.map(migrateBB):arr;

// Grade drives suggested placement: value (incl. tags) + weighted net votes
function bbGrade(p,tags,gms){
const ev=bbEval(p,(tags||{})[p.id]);
const votes=((gms[0]&&gms[0].votes||{})[p.id]||0)+((gms[1]&&gms[1].votes||{})[p.id]||0);
return {ev,votes,grade:Math.round(ev.value+votes*2)};
}
const slotLabel=(r,i)=>r+'.'+(i+1);

// ═══════════════════════════════════════════════════════════
// BIG BOARD VIEW
// ═══════════════════════════════════════════════════════════
function BigBoard({board,updateBoard,gms,onVote,draftedIds,onToggleDraft}){
const bd=board.bbBoard||bbEmptyBoard();
const tags=board.bbTags||{};
const [q,setQ]=useState('');
const [pf,setPf]=useState('ALL');
const [dragOver,setDragOver]=useState(null);
const [hideDrafted,setHideDrafted]=useState(false);
const [voteAmt,setVoteAmt]=useState(1);

const commit=(nb)=>updateBoard({bbBoard:bbCascade(nb)});
const clone=()=>{const o={};for(let r=1;r<=BB_ROUNDS;r++)o[r]=[...(bd[r]||[])];return o;};
const findAt=(pid)=>{for(let r=1;r<=BB_ROUNDS;r++){const i=(bd[r]||[]).indexOf(pid);if(i>=0)return {round:r,idx:i};}return null;};

// place pid at round/index; removes from old spot first
const placeAt=(pid,round,idx)=>{
const nb=clone();
for(let r=1;r<=BB_ROUNDS;r++)nb[r]=nb[r].filter(x=>x!==pid);
const arr=nb[round];
const at=Math.max(0,Math.min(idx===null||idx===undefined?arr.length:idx,arr.length));
arr.splice(at,0,pid);
commit(nb);
};
const removeFromBoard=(pid)=>{const nb=clone();for(let r=1;r<=BB_ROUNDS;r++)nb[r]=nb[r].filter(x=>x!==pid);commit(nb);};
const nudge=(pid,dir)=>{
const loc=findAt(pid);if(!loc)return;
const nb=clone();
nb[loc.round].splice(loc.idx,1);
let tr=loc.round,ti=loc.idx+dir;
if(ti<0){if(loc.round===1){ti=0;}else{tr=loc.round-1;ti=nb[tr].length;}}
else if(ti>nb[tr].length){tr=Math.min(BB_ROUNDS,loc.round+1);ti=0;}
nb[tr].splice(ti,0,pid);
commit(nb);
};

// ── grades + globally suggested slot (can cross rounds) ──
const placed=[];for(let r=1;r<=BB_ROUNDS;r++)(bd[r]||[]).forEach(pid=>placed.push(pid));
const gradeOf={};placed.forEach(pid=>{const p=BB_BY_ID[pid];if(p)gradeOf[pid]=bbGrade(p,tags,gms);});
const ranked=[...placed].filter(pid=>BB_BY_ID[pid]).sort((a,b)=>gradeOf[b].grade-gradeOf[a].grade);
const suggest={};ranked.forEach((pid,i)=>{suggest[pid]={round:Math.floor(i/BB_SLOTS)+1,idx:i%BB_SLOTS};});

const reRankBoard=()=>{const nb=bbEmptyBoard();ranked.forEach((pid,i)=>{nb[Math.floor(i/BB_SLOTS)+1].push(pid);});commit(nb);};
const reRankRound=(r)=>{const nb=clone();nb[r]=[...nb[r]].sort((a,b)=>(gradeOf[b]?.grade||0)-(gradeOf[a]?.grade||0));commit(nb);};

const onDropSlot=(round,idx,e)=>{
e.preventDefault();e.stopPropagation();
const pid=e.dataTransfer.getData('text/plain');
setDragOver(null);
if(!pid||!BB_BY_ID[pid])return;
placeAt(pid,round,idx);
};

let pool=BB_PLAYERS.filter(p=>!placed.includes(p.id));
pool=pool.filter(p=>(pf==='ALL'||p.pos===pf)&&(!q||p.name.toLowerCase().includes(q.toLowerCase())||p.team.toLowerCase().includes(q.toLowerCase())));
if(hideDrafted)pool=pool.filter(p=>!draftedIds.has(p.id));

const misplaced=ranked.filter(pid=>{const a=findAt(pid),s=suggest[pid];return a&&s&&(a.round!==s.round||a.idx!==s.idx);}).length;

const VoteCtrl=({pid})=><div style={{display:'flex',gap:3,alignItems:'center'}}>
{gms.map((gm,i)=>gm.name?<div key={i} style={{display:'flex',alignItems:'center',gap:1}}>
<button className="btn btn-xs btn-secondary" title={'+'+voteAmt+' '+gm.name} style={{color:gm.color,padding:'2px 5px'}} onClick={()=>onVote(i,pid,voteAmt)}>▲</button>
<span style={{fontSize:11,fontWeight:800,color:gm.color,minWidth:18,textAlign:'center'}}>{(gm.votes||{})[pid]||0}</span>
<button className="btn btn-xs btn-secondary" title={'-'+voteAmt+' '+gm.name} style={{color:gm.color,padding:'2px 5px'}} onClick={()=>onVote(i,pid,-voteAmt)}>▼</button>
</div>:null)}
</div>;

return <div>
{/* ── Front-office slot wall ── */}
<div style={{background:'linear-gradient(180deg,#111827,#1e293b)',border:'2px solid #b8860b',borderRadius:12,padding:16,marginBottom:20}}>
<div style={{textAlign:'center',marginBottom:12}}>
<div style={{fontSize:20,fontWeight:900,letterSpacing:4,color:'#d4af37'}}>WAR ROOM · BIG BOARD</div>
<div style={{fontSize:11,color:'#94a3b8',letterSpacing:2}}>12 ROUNDS × 12 SLOTS · DRAG A PLAYER ONTO ANY SLOT TO RANK HIM</div>
</div>
<div style={{display:'flex',gap:8,justifyContent:'center',marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
<button className="btn btn-sm" style={{background:'#b8860b',color:'#111827',fontWeight:800}} onClick={reRankBoard}>⚡ Re-rank Whole Board</button>
<span style={{fontSize:11,color:misplaced?'#fbbf24':'#4ade80'}}>{misplaced?misplaced+' player'+(misplaced===1?'':'s')+' sitting off their suggested slot':'Board matches suggested order'}</span>
</div>
{[...Array(BB_ROUNDS)].map((_,ri)=>{const r=ri+1;const arr=bd[r]||[];
return <div key={r} style={{marginBottom:10}}>
<div style={{display:'flex',alignItems:'center',gap:8,marginBottom:3}}>
<div style={{background:r<=3?'#b8860b':'#334155',color:r<=3?'#111827':'#d4af37',fontWeight:900,fontSize:12,letterSpacing:1,padding:'3px 10px',borderRadius:4}}>ROUND {r}</div>
<span style={{fontSize:11,color:'#64748b'}}>{arr.length}/{BB_SLOTS}</span>
{arr.length>1&&<button className="btn btn-xs btn-secondary" onClick={()=>reRankRound(r)}>⇅ Re-rank</button>}
</div>
<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(250px,1fr))',gap:4}}>
{[...Array(BB_SLOTS)].map((__,si)=>{
const pid=arr[si];const p=pid?BB_BY_ID[pid]:null;
const key=r+':'+si;
const g=p?gradeOf[pid]:null;
const s=p?suggest[pid]:null;
const off=s&&(s.round!==r||s.idx!==si);
return <div key={key}
onDragOver={e=>{e.preventDefault();setDragOver(key);}}
onDragLeave={()=>setDragOver(d=>d===key?null:d)}
onDrop={e=>onDropSlot(r,si,e)}
style={{display:'flex',alignItems:'center',gap:6,padding:'4px 6px',borderRadius:5,minHeight:34,
border:dragOver===key?'2px solid #d4af37':'1px dashed '+(p?'transparent':'#334155'),
background:p?'rgba(30,41,59,.9)':'rgba(15,23,42,.4)'}}>
<span style={{fontFamily:'monospace',fontSize:11,fontWeight:800,color:'#d4af37',minWidth:30}}>{slotLabel(r,si)}</span>
{p?<>
<div draggable onDragStart={e=>{e.dataTransfer.setData('text/plain',p.id);e.dataTransfer.effectAllowed='move';}}
style={{width:8,height:24,borderRadius:2,background:BB_POS_COLORS[p.pos],cursor:'grab',flexShrink:0}} title="Drag to move"/>
<div style={{flex:1,minWidth:0}}>
<div style={{fontSize:12,fontWeight:700,color:'#f1f5f9',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',textDecoration:draftedIds.has(p.id)?'line-through':'none'}}>
{p.name} <span style={{color:'#94a3b8',fontWeight:500}}>{p.pos}{p.posRank}</span>
</div>
<div style={{fontSize:10,color:'#64748b'}}>
Grade {g.grade}{g.votes?' · '+(g.votes>0?'+':'')+g.votes+'★':''}
{(tags[p.id]||[]).map(k=>' '+BB_TAGS.find(t=>t.k===k).label.split(' ')[0]).join('')}
{off?<span style={{color:'#fbbf24'}}> → {slotLabel(s.round,s.idx)}</span>:null}
</div>
</div>
<div style={{display:'flex',flexDirection:'column',gap:1}}>
<button className="btn btn-xs btn-secondary" style={{padding:'0 4px',lineHeight:1.2}} onClick={()=>nudge(p.id,-1)}>▲</button>
<button className="btn btn-xs btn-secondary" style={{padding:'0 4px',lineHeight:1.2}} onClick={()=>nudge(p.id,1)}>▼</button>
</div>
<button className="btn btn-xs btn-secondary" style={{padding:'2px 5px'}} title="Remove from board" onClick={()=>removeFromBoard(p.id)}>✕</button>
</>:<span style={{fontSize:11,color:'#334155'}}>empty</span>}
</div>;})}
</div>
</div>;})}
</div>

{/* ── Available pool ── */}
<div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
<input style={{width:200}} placeholder="Search top 200..." value={q} onChange={e=>setQ(e.target.value)}/>
<select style={{width:88}} value={pf} onChange={e=>setPf(e.target.value)}>
<option value="ALL">All Pos</option>
{BB_POSITIONS.map(p=><option key={p} value={p}>{p}</option>)}
</select>
<label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--textDim)',cursor:'pointer'}}>
<input type="checkbox" style={{width:'auto'}} checked={hideDrafted} onChange={e=>setHideDrafted(e.target.checked)}/>Hide drafted
</label>
<div style={{display:'flex',alignItems:'center',gap:5,marginLeft:8}}>
<span style={{fontSize:12,color:'var(--textDim)'}}>Votes per click:</span>
<input type="number" min="1" max="50" value={voteAmt} style={{width:58}}
onChange={e=>setVoteAmt(Math.max(1,Math.min(50,parseInt(e.target.value,10)||1)))}/>
{[1,5,10].map(n=><button key={n} className="btn btn-xs" style={{background:voteAmt===n?'var(--accent)':'var(--surface2)',border:'1px solid var(--border)'}} onClick={()=>setVoteAmt(n)}>{n}</button>)}
</div>
<span style={{fontSize:12,color:'var(--textDim)'}}>{pool.length} available · {placed.length} on board</span>
</div>

<div style={{display:'flex',flexDirection:'column',gap:6}}>
{pool.map(p=>{
const ev=bbEval(p,tags[p.id]);
const drafted=draftedIds.has(p.id);
const firstOpen=(()=>{for(let r=1;r<=BB_ROUNDS;r++)if((bd[r]||[]).length<BB_SLOTS)return {r,i:(bd[r]||[]).length};return null;})();
return <div key={p.id} className="card-sm" draggable
onDragStart={e=>{e.dataTransfer.setData('text/plain',p.id);e.dataTransfer.effectAllowed='move';}}
style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',opacity:drafted?.55:1,borderLeft:'4px solid '+BB_POS_COLORS[p.pos],cursor:'grab'}}>
<div style={{width:34,textAlign:'center',fontWeight:800,fontSize:13,color:'var(--textDim)'}}>#{p.rank}</div>
<div style={{flex:1,minWidth:160}}>
<div style={{fontWeight:700,fontSize:14,textDecoration:drafted?'line-through':'none'}}>{p.name} {ev.breakout?<span title="Breakout profile">🚀</span>:null}</div>
<div style={{fontSize:11,color:'var(--textDim)'}}>{p.pos}{p.posRank} · {p.team} · ADP {p.adp}</div>
</div>
<div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
<span className="badge badge-blue" title="Expected PPR per game">{p.expPPR} xPPR</span>
<span className="badge badge-purple" title="Dropoff to next at position">▼ {p.dropoff}</span>
<span className={'badge '+scoreBadge(ev.value)}>{ev.value}</span>
<span className={'badge '+ev.vClass} style={{fontSize:10}}>{ev.verdict}</span>
</div>
<div style={{display:'flex',gap:3}}>
{BB_TAGS.map(t=><button key={t.k} className="btn btn-xs" title={t.label}
style={{background:(tags[p.id]||[]).includes(t.k)?'var(--accent)':'var(--surface2)',border:'1px solid var(--border)',padding:'2px 6px'}}
onClick={()=>{const cur=tags[p.id]||[];const nv=cur.includes(t.k)?cur.filter(x=>x!==t.k):[...cur,t.k];const nt={...tags};if(nv.length)nt[p.id]=nv;else delete nt[p.id];updateBoard({bbTags:nt});}}>{t.label.split(' ')[0]}</button>)}
</div>
<VoteCtrl pid={p.id}/>
<select style={{width:80}} value="" onChange={e=>{if(e.target.value)placeAt(p.id,+e.target.value,null);}}>
<option value="">Add to…</option>
{[...Array(BB_ROUNDS)].map((_,i)=><option key={i+1} value={i+1}>Rd {i+1}</option>)}
</select>
{firstOpen&&<button className="btn btn-xs btn-secondary" title={'Place at '+slotLabel(firstOpen.r,firstOpen.i)} onClick={()=>placeAt(p.id,firstOpen.r,null)}>+ {slotLabel(firstOpen.r,firstOpen.i)}</button>}
<button className={'btn btn-xs '+(drafted?'btn-danger':'btn-success')} onClick={()=>onToggleDraft(p.id)}>{drafted?'Undo':'Draft'}</button>
</div>;})}
{pool.length===0&&<div className="card" style={{textAlign:'center',color:'var(--textDim)',fontSize:13}}>No available players match your filters.</div>}
</div>
</div>;
}


// ═══════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════
function App(){
const [darkMode,setDarkMode]=useState(true);
const [mode,setMode]=useState('fantasy');
const [view,setView]=useState('board');
const [boards,setBoards]=useState([{
id:'b1',name:'My Draft Board',created:Date.now(),archived:false,password:'',
tiers:DEFAULT_TIERS.map(t=>({...t,players:[]})),
format:'halfPpr',offScheme:'Balanced',defScheme:'4-3 Base',
gms:[{name:'',color:'#3b82f6',pin:'',votes:{}},{name:'',color:'#ef4444',pin:'',votes:{}}],
notes:{},tags:{},filters:{},draftedIds:[],bbRounds:{},bbTags:{},bbBoard:bbEmptyBoard()}]);
const [activeBoard,setActiveBoard]=useState('b1');
const [search,setSearch]=useState('');
const [posFilter,setPosFilter]=useState('ALL');
const [typeFilter,setTypeFilter]=useState('ALL');
const [sortBy,setSortBy]=useState('score');
const [sidebarOpen,setSidebarOpen]=useState(true);
const [gmSetupOpen,setGmSetupOpen]=useState(false);
const [notes,setNotes]=useState({});
const [pinModal,setPinModal]=useState(null);
const [pinInput,setPinInput]=useState('');

const rawBoard=boards.find(b=>b.id===activeBoard);
const board=useMemo(()=>rawBoard?migrateBB(rawBoard):rawBoard,[rawBoard]);
const format=board?.format||'halfPpr';
const offScheme=board?.offScheme||'Balanced';
const defScheme=board?.defScheme||'4-3 Base';
const gms=board?.gms||[{name:'',color:'#3b82f6',pin:'',votes:{}},{name:'',color:'#ef4444',pin:'',votes:{}}];

const draftedIds=useMemo(()=>new Set(board?.draftedIds||[]),[board?.draftedIds]);

const updateBoard=(updates)=>setBoards(prev=>prev.map(b=>b.id===activeBoard?{...b,...updates}:b));

const toggleDraft=(playerId)=>{
const current=board?.draftedIds||[];
const next=current.includes(playerId)?current.filter(id=>id!==playerId):[...current,playerId];
updateBoard({draftedIds:next});
};

const saveAllBoards=()=>{
const data={boards,notes,savedAt:new Date().toISOString()};
const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);
a.download='war-room-save-'+new Date().toISOString().slice(0,10)+'.json';a.click();
};
const loadAllBoards=(e)=>{
const file=e.target.files[0];if(!file)return;
const r=new FileReader();r.onload=ev=>{
try{
const data=JSON.parse(ev.target.result);
if(data.boards&&Array.isArray(data.boards)){const mig=migrateBoards(data.boards);setBoards(mig);setActiveBoard(mig[0]?.id||null);}
if(data.notes)setNotes(data.notes);
}catch(err){}
};r.readAsText(file);e.target.value='';
};

const filteredPlayers=useMemo(()=>{
let list=[...ALL_PLAYERS];
if(search)list=list.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())||p.team?.toLowerCase().includes(search.toLowerCase())||p.college?.toLowerCase().includes(search.toLowerCase()));
if(posFilter!=='ALL')list=list.filter(p=>p.pos===posFilter);
if(typeFilter==='veteran')list=list.filter(p=>p.type==='veteran');
if(typeFilter==='rookie')list=list.filter(p=>p.type==='rookie');
if(typeFilter==='prospect')list=list.filter(p=>p.type==='prospect');

list=list.map(p=>({...p,_fs:calcFantasyScore(p,format),_fr:calcFranchiseScore(p,offScheme,defScheme),_sl:getSleeperRating(p),_bust:getBustRisk(p),_bk:getBreakoutScore(p),_sf:calcSchemeFit(p,offScheme,defScheme)}));

if(sortBy==='score')list.sort((a,b)=>mode==='fantasy'?b._fs-a._fs:b._fr-a._fr);
else if(sortBy==='name')list.sort((a,b)=>a.name.localeCompare(b.name));
else if(sortBy==='age')list.sort((a,b)=>a.age-b.age);
else if(sortBy==='sleeper')list.sort((a,b)=>b._sl-a._sl);
else if(sortBy==='breakout')list.sort((a,b)=>b._bk-a._bk);
else if(sortBy==='bust')list.sort((a,b)=>b._bust-a._bust);
else if(sortBy==='schemeFit')list.sort((a,b)=>b._sf-a._sf);
else if(sortBy==='votes'){
list.sort((a,b)=>{
const va=((gms[0]?.votes||{})[a.id]||0)+((gms[1]?.votes||{})[a.id]||0);
const vb=((gms[0]?.votes||{})[b.id]||0)+((gms[1]?.votes||{})[b.id]||0);
return vb-va;
});
}
return list;
},[search,posFilter,typeFilter,sortBy,mode,format,offScheme,defScheme,gms]);

const handleVote=(gmIdx,playerId,delta)=>{
if(!gms[gmIdx]?.pin){setGmSetupOpen(true);return;}
setPinModal({gmIdx,playerId,delta});
setPinInput('');
};

const confirmVote=()=>{
if(!pinModal)return;
const {gmIdx,playerId,delta}=pinModal;
if(pinInput!==gms[gmIdx].pin){alert('Incorrect PIN');return;}
const currentVotes={...gms[gmIdx].votes};
const current=currentVotes[playerId]||0;
const newVal=current+delta;
const projected={...currentVotes,[playerId]:newVal};
const usedAfter=Object.values(projected).reduce((s,v)=>s+Math.abs(v),0);
if(usedAfter>VOTE_BUDGET){
const usedNow=Object.values(currentVotes).reduce((s,v)=>s+Math.abs(v),0);
alert('That would use '+usedAfter+' of '+VOTE_BUDGET+' votes. '+(VOTE_BUDGET-usedNow)+' remaining.');
setPinModal(null);setPinInput('');return;}
currentVotes[playerId]=newVal;
if(newVal===0)delete currentVotes[playerId];
const newGms=[...gms];
newGms[gmIdx]={...newGms[gmIdx],votes:currentVotes};
updateBoard({gms:newGms});
setPinModal(null);setPinInput('');
};

useEffect(()=>{document.body.className=darkMode?'':'light';},[darkMode]);

const views={
board:'📋 Fantasy Roster',
bigboard:'🏛️ Big Board',
tiers:'🏗️ Tier Board',
myteam:'🏟️ My Team',
dashboard:'📊 Dashboard',
recs:'💡 Recommendations',
collab:'🤝 Collaboration',
boards:'📁 Boards'
};
const draftedCount=draftedIds.size;

return <AppCtx.Provider value={{notes,setNotes}}>
<div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
{/* Sidebar */}
{sidebarOpen&&<div className="sidebar" style={{display:'flex',flexDirection:'column'}}>
<div style={{padding:16,borderBottom:'1px solid var(--border)'}}>
<div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
<span style={{fontSize:20}}>🏈</span>
<h1 style={{fontSize:18,fontWeight:800,background:'linear-gradient(135deg,var(--accent),var(--accent2))',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>WAR ROOM</h1>
</div>
{/* Mode Toggle */}
<div style={{display:'flex',gap:4,background:'var(--surface2)',borderRadius:8,padding:3}}>
<button className={`tab ${mode==='fantasy'?'active':''}`} style={{flex:1,fontSize:12}} onClick={()=>setMode('fantasy')}>Fantasy</button>
<button className={`tab ${mode==='madden'?'active':''}`} style={{flex:1,fontSize:12}} onClick={()=>setMode('madden')}>Madden</button>
</div>
</div>

{/* Nav */}
<div style={{padding:12,flex:1,overflowY:'auto'}}>
{Object.entries(views).map(([k,label])=>
<button key={k} className={`tab ${view===k?'active':''}`} onClick={()=>setView(k)}
style={{display:'block',width:'100%',textAlign:'left',marginBottom:4}}>{label}{k==='myteam'&&draftedCount>0?' ('+draftedCount+')':''}</button>
)}

<div style={{borderTop:'1px solid var(--border)',marginTop:12,paddingTop:12}}>
<button className="btn btn-secondary btn-sm" style={{width:'100%',marginBottom:6}} onClick={()=>setGmSetupOpen(true)}>👥 GM Setup</button>
</div>

{/* Scoring / Scheme */}
<div style={{borderTop:'1px solid var(--border)',marginTop:12,paddingTop:12}}>
<label style={{fontSize:11,fontWeight:600,color:'var(--textDim)',display:'block',marginBottom:4}}>
{mode==='fantasy'?'SCORING FORMAT':'OFFENSIVE SCHEME'}
</label>
{mode==='fantasy'?
<select value={format} onChange={e=>updateBoard({format:e.target.value})}>
{Object.entries(SCORING_FORMATS).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
</select>:
<select value={offScheme} onChange={e=>updateBoard({offScheme:e.target.value})}>
{OFF_SCHEMES.map(s=><option key={s} value={s}>{s}</option>)}
</select>}

{mode==='madden'&&<>
<label style={{fontSize:11,fontWeight:600,color:'var(--textDim)',display:'block',marginBottom:4,marginTop:8}}>DEFENSIVE SCHEME</label>
<select value={defScheme} onChange={e=>updateBoard({defScheme:e.target.value})}>
{DEF_SCHEMES.map(s=><option key={s} value={s}>{s}</option>)}
</select>
</>}
</div>

{/* Active Board */}
{board&&<div style={{borderTop:'1px solid var(--border)',marginTop:12,paddingTop:12}}>
<label style={{fontSize:11,fontWeight:600,color:'var(--textDim)',display:'block',marginBottom:4}}>ACTIVE BOARD</label>
<div style={{fontSize:13,fontWeight:600}}>{board.name}</div>
</div>}

{/* GM Status */}
{(gms[0]?.name||gms[1]?.name)&&<div style={{borderTop:'1px solid var(--border)',marginTop:12,paddingTop:12}}>
<label style={{fontSize:11,fontWeight:600,color:'var(--textDim)',display:'block',marginBottom:6}}>GM STATUS</label>
{gms.map((gm,i)=>gm.name?<div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
<div style={{display:'flex',alignItems:'center',gap:6}}>
<div style={{width:10,height:10,borderRadius:'50%',background:gm.color}}/>
<span style={{fontSize:12,fontWeight:600}}>{gm.name}</span>
</div>
<span style={{fontSize:11,color:'var(--textDim)'}}>{Object.values(gm.votes).reduce((s,v)=>s+Math.abs(v),0)}/{VOTE_BUDGET}</span>
</div>:null)}
</div>}
</div>

<div style={{padding:12,borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between'}}>
<button className="btn btn-secondary btn-xs" onClick={()=>setDarkMode(!darkMode)}>{darkMode?'☀️ Light':'🌙 Dark'}</button>
<button className="btn btn-secondary btn-xs" onClick={saveAllBoards}>💾 Save</button>
</div>
</div>}

{/* Main Content */}
<div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
{/* Top Bar */}
<div style={{padding:'12px 20px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap',background:'var(--surface)'}}>
<button className="btn btn-secondary btn-sm" onClick={()=>setSidebarOpen(!sidebarOpen)}>☰</button>

{(view==='board'||view==='tiers')&&<>
<input style={{width:240}} placeholder="Search players..." value={search} onChange={e=>setSearch(e.target.value)}/>
<select style={{width:100}} value={posFilter} onChange={e=>setPosFilter(e.target.value)}>
<option value="ALL">All Pos</option>
{POSITIONS.map(p=><option key={p} value={p}>{p}</option>)}
</select>
<select style={{width:110}} value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
<option value="ALL">All Types</option>
<option value="veteran">Veterans</option>
<option value="rookie">Rookies</option>
<option value="prospect">Prospects</option>
</select>
<select style={{width:120}} value={sortBy} onChange={e=>setSortBy(e.target.value)}>
<option value="score">{mode==='fantasy'?'Fantasy Score':'Franchise Score'}</option>
<option value="name">Name</option>
<option value="age">Age</option>
{mode==='fantasy'&&<option value="sleeper">Sleeper Rating</option>}
<option value="breakout">Breakout</option>
<option value="bust">Bust Risk</option>
{mode==='madden'&&<option value="schemeFit">Scheme Fit</option>}
<option value="votes">Votes</option>
</select>
<span style={{fontSize:12,color:'var(--textDim)'}}>{filteredPlayers.length} players</span>
</>}

<div style={{marginLeft:'auto',display:'flex',gap:6}}>
<span className="badge badge-blue" style={{fontSize:12}}>{mode==='fantasy'?'Fantasy Mode':'Madden Mode'}</span>
{mode==='fantasy'&&<span className="badge badge-purple" style={{fontSize:12}}>{SCORING_FORMATS[format]?.label}</span>}
{mode==='madden'&&<span className="badge badge-purple" style={{fontSize:12}}>{offScheme}</span>}
</div>
</div>

{/* Content */}
<div style={{flex:1,overflow:'auto',padding:20}}>
{view==='board'&&<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:12}}>
{filteredPlayers.map(p=><PlayerCard key={p.id} player={p} mode={mode} format={format}
offScheme={offScheme} defScheme={defScheme} gms={gms}
onVote={handleVote} onNote={()=>{}} drafted={draftedIds.has(p.id)} onToggleDraft={toggleDraft}/>)}
</div>}

{view==='bigboard'&&board&&<BigBoard board={board} updateBoard={updateBoard} gms={gms}
onVote={handleVote} draftedIds={draftedIds} onToggleDraft={toggleDraft}/>}

{view==='myteam'&&<MyTeamView draftedIds={draftedIds} players={ALL_PLAYERS.concat(BB_PLAYERS)} mode={mode}
format={format} offScheme={offScheme} defScheme={defScheme} onUndraft={toggleDraft}/>}

{view==='tiers'&&board&&<TierBoard tiers={Array.isArray(board.tiers)?board.tiers:DEFAULT_TIERS.map(t=>({...t,players:[]}))}
setTiers={u=>setBoards(prev=>prev.map(b=>{if(b.id!==activeBoard)return b;const cur=Array.isArray(b.tiers)?b.tiers:DEFAULT_TIERS.map(t=>({...t,players:[]}));return {...b,tiers:typeof u==='function'?u(cur):u};}))}
players={filteredPlayers} mode={mode} format={format} offScheme={offScheme} defScheme={defScheme}
gms={gms} onVote={handleVote}/>}

{view==='dashboard'&&(mode==='fantasy'?
<FantasyDashboard players={NFL_PLAYERS} format={format}/>:
<FranchiseDashboard players={ALL_PLAYERS} offScheme={offScheme} defScheme={defScheme}/>)}

{view==='recs'&&<Recommendations players={NFL_PLAYERS} mode={mode} format={format} offScheme={offScheme} defScheme={defScheme}/>}

{view==='collab'&&<CollabDashboard players={ALL_PLAYERS.concat(BB_PLAYERS)} gms={gms} format={format} mode={mode} offScheme={offScheme} defScheme={defScheme}/>}

{view==='boards'&&<BoardManager boards={boards} setBoards={setBoards} activeBoard={activeBoard} setActiveBoard={setActiveBoard} onSaveAll={saveAllBoards} onLoadAll={loadAllBoards}/>}
</div>
</div>
</div>

{/* GM Setup Modal */}
<Modal open={gmSetupOpen} onClose={()=>setGmSetupOpen(false)} title="GM Setup">
<GMSetup gms={gms} setGms={g=>updateBoard({gms:g})}/>
</Modal>

{/* PIN Verification Modal */}
<Modal open={!!pinModal} onClose={()=>setPinModal(null)} title="Enter PIN to Vote">
<div style={{display:'flex',flexDirection:'column',gap:12,alignItems:'center'}}>
<p style={{fontSize:13,color:'var(--textDim)'}}>Enter {pinModal?gms[pinModal.gmIdx]?.name+"'s":''} 4-digit PIN</p>
<input type="password" maxLength={4} value={pinInput} onChange={e=>setPinInput(e.target.value.replace(/\D/g,'').slice(0,4))}
style={{width:120,textAlign:'center',fontSize:24,letterSpacing:8}} autoFocus
onKeyDown={e=>{if(e.key==='Enter')confirmVote();}}/>
<button className="btn btn-primary" onClick={confirmVote}>Confirm Vote</button>
</div>
</Modal>
</AppCtx.Provider>;
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
